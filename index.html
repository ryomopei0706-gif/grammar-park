<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Grammar Park</title>
<meta name="description" content="中学英文法を会話で使える形で身につける自分専用トレーナー">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grammar Park">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --card2:#E9EDF3; --ink:#0F1B33; --ink2:#465170; --muted:#7C869E;
  --line:#DCE2EC; --accent:#FF7A1A; --accent-soft:#FFEBDC; --on-accent:#FFFFFF;
  --lagoon:#0FA3A0; --lagoon-soft:#DDF4F3; --ok:#1E9E6A; --ok-soft:#DFF5EA; --ng:#D99400; --ng-soft:#FCF0D2;
  --warn:#D99400; --shadow:0 10px 30px rgba(15,27,51,.08); --shadow-sm:0 2px 8px rgba(15,27,51,.06);
  --pass:#101C36; --pass-ink:#F3F5F8; --pass-muted:#8FA0C4; --pass-line:rgba(255,255,255,.14);
  --b-subj:#3B82F6; --b-verb:#EF4444; --b-obj:#22C55E; --b-mod:#EAB308; --b-aux:#A855F7; --b-neg:#9CA3AF;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
  --radius:22px; --tab-h:64px; --fs:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --card:#141D31; --card2:#1B2640; --ink:#EEF2F8; --ink2:#B8C1D6; --muted:#8792AB;
    --line:#26314B; --accent:#FF8C3A; --accent-soft:#3A2515; --on-accent:#14100C;
    --lagoon:#2CC3BF; --lagoon-soft:#12343A; --ok:#3BC48A; --ok-soft:#153427; --ng:#F0B429; --ng-soft:#3B2E12;
    --warn:#F0B429; --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
    --pass:#182444; --pass-ink:#F3F5F8; --pass-muted:#93A3C8; --pass-line:rgba(255,255,255,.14);
    --b-subj:#60A5FA; --b-verb:#F87171; --b-obj:#4ADE80; --b-mod:#FACC15; --b-aux:#C084FC; --b-neg:#B0B7C3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --card:#141D31; --card2:#1B2640; --ink:#EEF2F8; --ink2:#B8C1D6; --muted:#8792AB;
  --line:#26314B; --accent:#FF8C3A; --accent-soft:#3A2515; --on-accent:#14100C;
  --lagoon:#2CC3BF; --lagoon-soft:#12343A; --ok:#3BC48A; --ok-soft:#153427; --ng:#F0B429; --ng-soft:#3B2E12;
  --warn:#F0B429; --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --pass:#182444; --pass-ink:#F3F5F8; --pass-muted:#93A3C8; --pass-line:rgba(255,255,255,.14);
  --b-subj:#60A5FA; --b-verb:#F87171; --b-obj:#4ADE80; --b-mod:#FACC15; --b-aux:#C084FC; --b-neg:#B0B7C3;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{font-size:calc(16px * var(--fs))}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;
  min-height:100dvh;touch-action:manipulation}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);-webkit-user-select:text;user-select:text}
h1,h2,h3{margin:0;line-height:1.25}
p{margin:0}
.mono{font-family:var(--mono);letter-spacing:.02em}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.8125rem}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.spk{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;background:var(--card2);color:var(--ink2);flex:none}
.spk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spk.on{color:var(--accent);background:var(--accent-soft)}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;min-height:100dvh}
.screen{display:flex;flex-direction:column;gap:18px;flex:1;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px);max-width:560px;width:100%;margin:0 auto}
.screen.notab{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.eyebrow{font-family:var(--mono);font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.h-row h1{font-size:1.625rem;font-weight:800;letter-spacing:-.02em}
.h-row h2{font-size:1.0625rem;font-weight:800}
.sub{color:var(--muted);font-size:.8125rem}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;
  padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:color-mix(in srgb,var(--card) 88%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
#tabbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:14px;
  font-size:.6875rem;font-weight:600;color:var(--muted)}
#tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabbar button.on{color:var(--accent)}

/* ---------- cards & buttons ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:14px}
.card.flat{box-shadow:none;background:var(--card2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:16px;background:var(--card2);color:var(--ink);font-weight:700;font-size:1rem;width:100%;transition:transform .1s}
.btn.primary{background:var(--accent);color:var(--on-accent);min-height:64px;font-size:1.125rem;border-radius:20px;box-shadow:0 8px 24px rgba(255,122,26,.3)}
.btn.line{background:transparent;border:1.5px solid var(--line)}
.btn.sm{min-height:40px;font-size:.875rem;padding:6px 14px;width:auto}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.4;transform:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:.8125rem;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow-sm)}
.stat .v{font-family:var(--mono);font-size:1.375rem;line-height:1.1}
.stat .k{font-size:.6875rem;color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--lagoon);transition:width .5s ease}
.bar.acc i{background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);font-size:.75rem;font-weight:700;color:var(--ink2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-sm);font-weight:700;font-size:1.0625rem;border:1.5px solid var(--line)}
.chip.ghost{opacity:.25}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow-sm)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:.9375rem}
.li .t span{font-size:.75rem;color:var(--muted)}
.li.dim{opacity:.45}
.stars{font-family:var(--mono);font-size:.75rem;letter-spacing:.05em;color:var(--accent)}
.stars .e{color:var(--line)}

/* ---------- pass (home) ---------- */
.pass{background:var(--pass);color:var(--pass-ink);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;position:relative;padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px}
.pass .eyebrow{color:var(--pass-muted)}
.pass .big{font-size:1.25rem;font-weight:800;line-height:1.3}
.pass .foot{display:flex;justify-content:space-between;gap:12px;padding-top:10px;border-top:1px dashed var(--pass-line);font-size:.75rem;color:var(--pass-muted)}
.pass .foot b{color:var(--pass-ink);font-weight:700}
.pass::before,.pass::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--bg);left:-11px;bottom:44px}
.pass::after{left:auto;right:-11px}
.quest{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.9375rem}
.quest .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.75rem}
.quest.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.quest.done{color:var(--muted);text-decoration:line-through}
.level{display:flex;align-items:center;gap:14px}
.level .badge{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.125rem;flex:none}
.level .t{flex:1;min-width:0}
.level .t b{display:block;font-size:1rem;font-weight:800}
.level .t span{font-size:.75rem;color:var(--muted)}

/* ---------- session ---------- */
.shead{display:flex;align-items:center;gap:12px;position:sticky;top:0;padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:8px;background:var(--bg);z-index:5}
.shead .x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);font-size:1.25rem}
.shead .bar{flex:1}
.shead .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);min-width:44px;text-align:right}
.q{display:flex;flex-direction:column;gap:16px;flex:1}
.q .prompt{font-size:1.5rem;font-weight:800;line-height:1.35;text-align:center;padding:12px 4px;letter-spacing:-.01em}
.q .prompt.en{font-size:1.375rem;font-weight:700}
.q .inst{text-align:center;color:var(--muted);font-size:.875rem}
.choices{display:flex;flex-direction:column;gap:10px}
.choices .btn{justify-content:flex-start;text-align:left;font-weight:600;min-height:56px;font-size:1.0625rem;line-height:1.35}
.choices .btn.pick{outline:3px solid var(--lagoon)}
.choices .btn.right{background:var(--ok-soft);color:var(--ok)}
.choices .btn.wrong{background:var(--ng-soft);color:var(--ng)}
.choices.two .btn{min-height:64px}
.answer-row{min-height:60px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:16px;border:2px dashed var(--line);align-content:flex-start}
.answer-row .chip{background:var(--lagoon-soft);border-color:transparent}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:1.375rem;font-weight:700;padding:8px}
.words .w{padding:6px 10px;border-radius:12px;border:1.5px solid var(--line)}
.words .w.pick{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.words .w.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.ring{width:84px;height:84px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--card2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:1.5rem}
.fb{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;animation:slidein .18s ease}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.ng{background:var(--ng-soft);color:var(--ng)}
.fb .en{font-size:1.25rem;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px}
.fb .en u{text-decoration:underline;text-decoration-color:var(--ng);text-decoration-thickness:3px}
.fb .why{font-size:.875rem;color:var(--ink2)}
.fb .alt{font-size:.8125rem;color:var(--muted)}
@keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.qfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.tinybtn{font-size:.8125rem;color:var(--muted);font-weight:600;padding:8px;text-align:center}
.textin{width:100%;min-height:52px;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:1.125rem}

/* ---------- meet (説明カード) ---------- */
.meet-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:12px}
.meet-card h3{font-size:1.125rem;font-weight:800}
.meet-card .body{font-size:1rem;color:var(--ink2);white-space:pre-line}
.meet-card .ex{border-top:1px solid var(--line);padding-top:10px;display:flex;align-items:center;gap:10px}
.meet-card .ex b{display:block;font-size:1.125rem}
.meet-card .ex span{font-size:.8125rem;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.blocks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.blk{padding:6px 12px;border-radius:10px;color:#fff;font-weight:800;font-size:1.0625rem;position:relative}
.blk small{display:block;font-size:.625rem;font-weight:600;opacity:.9;letter-spacing:.05em}
.blk.subj{background:var(--b-subj)}.blk.verb{background:var(--b-verb)}.blk.obj{background:var(--b-obj)}.blk.mod{background:var(--b-mod);color:#3a2a00}.blk.aux{background:var(--b-aux)}.blk.neg{background:var(--b-neg)}
.blk.ja{background:var(--card2);color:var(--ink2);font-weight:600;font-size:.9375rem}
.keyline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.keyline:last-child{border-bottom:0}
.keyline b{display:block;font-size:1.125rem}
.keyline span{font-size:.8125rem;color:var(--muted)}

/* ---------- result ---------- */
.result{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;padding-top:24px}
.result .emoji{font-size:3rem}
.result h2{font-size:1.375rem}
.result .cando{font-size:1.125rem;font-weight:700;color:var(--accent)}
.delta{display:flex;flex-direction:column;gap:6px;width:100%}
.delta .li{justify-content:space-between}

/* ---------- log / calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.75rem}
.cal .h{color:var(--muted);font-weight:600}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:var(--card2);color:var(--muted)}
.cal .d.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal .d.frz{border:2px dashed var(--lagoon);background:transparent;color:var(--lagoon)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.x{background:transparent}

/* ---------- settings ---------- */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .k{font-size:.9375rem}
.set .k small{display:block;color:var(--muted);font-size:.75rem}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .2s}
.switch.on{background:var(--ok)}
.switch.on::after{left:23px}
select.sel{padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.warnband{background:var(--ng-soft);color:var(--ng);border-radius:14px;padding:10px 14px;font-size:.8125rem;font-weight:600}

/* ---------- modal / toast ---------- */
#modal-root:empty{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:var(--card);border-radius:26px 26px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);width:100%;max-width:560px;max-height:85dvh;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:up .2s ease}
.modal h3{font-size:1.125rem;font-weight:800}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px)}}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:calc(100% - 32px);max-width:420px}
#toast div{background:var(--pass);color:var(--pass-ink);padding:10px 16px;border-radius:14px;font-size:.875rem;font-weight:600;box-shadow:var(--shadow);animation:fade .2s;text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:drop 1.4s ease-in forwards}
@keyframes drop{to{transform:translateY(110dvh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- onboarding ---------- */
.ob{display:flex;flex-direction:column;gap:20px;justify-content:center;flex:1;text-align:center}
.ob h1{font-size:1.75rem;font-weight:800;letter-spacing:-.02em}
.ob p{color:var(--ink2);font-size:1rem}
.ob .gate{font-size:4rem}
.ob input{width:100%;text-align:center;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:1.125rem}
.areahead{display:flex;align-items:center;gap:10px;padding:6px 0}
.areahead .c{width:12px;height:12px;border-radius:50%}
.areahead b{font-size:1rem}
.areahead span{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--muted)}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* ===== 10_core.js ===== */
'use strict';
/* ================= util ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pad2 = n => String(n).padStart(2, '0');
const fmtDate = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

/* ================= 間隔反復（SM-2系） ================= */
const EASE0 = 2.5, EASE_MIN = 1.3, FIRST = [1, 3], FUZZ = 0.10;

function newCard(t, today) {
  return { t, due: addDays(today, 1), ivl: 0, ease: EASE0, reps: 0, lapses: 0, stars: 1, last: null, hist: [] };
}
function starsFor(c) {
  const recentLapse = c.hist.slice(-3).some(h => h[1] === 0);
  if (c.ivl >= 60 && !recentLapse) return 5;
  if (c.ivl >= 30) return 4;
  if (c.ivl >= 7) return 3;
  if (c.reps >= 1) return 2;
  return 1;
}
/* q: 0=もう一度 1=難しい 2=できた 3=余裕 */
function rate(c, q, rtMs, today, rnd = Math.random) {

    c.lapses += 1; c.ivl = 1; c.ease = Math.max(EASE_MIN, c.ease - 0.20); c.stars = Math.max(1, c.stars - 1);

    if (q === 1) c.ease = Math.max(EASE_MIN, c.ease - 0.15);
    if (q === 3) c.ease = c.ease + 0.15;
    c.ivl = ivl; c.reps += 1;
  }
  c.hist.push([today, q, Math.round(rtMs || 0)]); if (c.hist.length > 10) c.hist = c.hist.slice(-10);

  c.due = addDays(today, Math.max(1, Math.round(c.ivl * fuzz)));

}
/* タップ形式の自動評価 */
function autoRate(correct, rtMs, partial) {

  if (rtMs <= 5000) return 2;

}
/* 自己判定（瞬間英作文）: revealed=答えを見てから押した */
function selfRate(said, rtMs, revealed) {

  if (revealed) return 1;

}
function dueCards(today) {

    .sort((a, b) => (a[1].stars - b[1].stars) || (a[1].due < b[1].due ? -1 : a[1].due > b[1].due ? 1 : 0));
}

function stepItems(uid, step) {

  const welcome = gap >= 7 && S.welcomeDone !== today && Object.keys(S.cards).length > 0;
  const CAP = { 5: 8, 10: 10, 15: 15 }[mode] || 10;
  let due = dueCards(today).slice(0, welcome ? 12 : CAP).map(([id, c]) => reviewItem(id, c)).filter(Boolean);
  due = interleave(due);

  const meta = { welcome, reviews: due.length, unit: null, steps: [], sprint: 0, mode };
  if (welcome) return { items, meta };

  const uid = nextUnitId();
  if (uid) {
    const st = unitState(uid); const n = { 5: 1, 10: 2, 15: 4 }[mode] || 2;
    const from = clamp(st.step || 1, 1, 4);

const LEVELS = [
  [0, 'ゲート前'], [100, '入園者'], [250, 'マップ持ち'], [450, '1日券'], [700, 'ファストパス'], [1000, '2エリア目'], [1400, 'ナイトパス'], [1900, '3エリア目'], [2500, '湖のほとり'], [3200, '塔の入口'],
  [4000, '年間パス'], [5000, 'コースター常連'], [6200, 'パレード先頭'], [7600, '花火の名所を知る人'], [9200, '裏道を知る人'], [11000, 'キャスト見習い'], [13000, 'キャスト'], [15500, 'エリアマネージャー'], [18500, 'パークデザイナー'], [22000, 'パークの創業者'],
];
function levelOf(xp) { let lv = 1; for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i][0]) lv = i + 1; return lv; }
function levelInfo(xp) {
  const lv = levelOf(xp); const cur = LEVELS[lv - 1][0]; const next = LEVELS[lv] ? LEVELS[lv][0] : null;
  return { lv, title: LEVELS[lv - 1][1], cur, next, pct: next ? clamp((xp - cur) / (next - cur), 0, 1) : 1 };
}
/* XP 加算。レベルアップしたら新レベルを返す */
function addXp(n) {
  const before = levelOf(S.xp); S.xp += n; dayLog('xp', n);
  const after = levelOf(S.xp);
  return after > before ? after : 0;
}

/* ---- 連続入園 ---- */
const FREEZE_PER_WEEK = 2;
function freezeAvailable(day) {
  const wk = weekKey(day); const used = S.streak.freezeUsed[wk] || 0;
  return used < FREEZE_PER_WEEK + (S.streak.freezeExtra || 0);
}
function useFreeze(day) {
  const wk = weekKey(day); S.streak.freezeUsed[wk] = (S.streak.freezeUsed[wk] || 0) + 1;
  const d = S.days[day] || (S.days[day] = { xp: 0, sessions: 0 }); d.frozen = true;
  // 週の凍結枠を使い切っていて extra があれば消費
  if (S.streak.freezeUsed[wk] > FREEZE_PER_WEEK && S.streak.freezeExtra > 0) S.streak.freezeExtra--;
  const ks = Object.keys(S.streak.freezeUsed).sort(); while (ks.length > 8) delete S.streak.freezeUsed[ks.shift()];
}
/* 1日の初回起動: 空いた日を凍結するか、切る */
function streakTick(today) {
  const last = S.streak.lastDay; if (!last || S.streak.cur === 0) return;
  const gap = daysBetween(last, today);
  for (let i = 1; i < gap; i++) {
    const d = addDays(last, i);
    if (S.days[d] && S.days[d].frozen) continue;
    if (freezeAvailable(d)) useFreeze(d); else { S.streak.cur = 0; break; }
  }
}
/* セッション完了時 */
function markStudied(today) {
  if (S.streak.lastDay === today) return false;
  S.streak.cur = S.streak.cur > 0 ? S.streak.cur + 1 : 1;
  if (S.streak.lastDay && daysBetween(S.streak.lastDay, today) === 1) { /* 連続 */ }
  S.streak.best = Math.max(S.streak.best, S.streak.cur);
  S.streak.lastDay = today;
  return true;
}
function freezeLeft(today) { const wk = weekKey(today); return Math.max(0, FREEZE_PER_WEEK + (S.streak.freezeExtra || 0) - (S.streak.freezeUsed[wk] || 0)); }

/* ---- デイリークエスト ---- */
function questTick(today) {
  if (S.quests.day !== today) S.quests = { day: today, done: { review: false, step: false, spoken: false }, bonus: false };
}
function questUpdate(kind) {
  const t = todayStr(); questTick(t);
  if (kind === 'review') S.quests.done.review = true;
  if (kind === 'step') S.quests.done.step = true;
  if (kind === 'spoken') { const d = S.days[t]; if (d && d.spoken >= 10) S.quests.done.spoken = true; }
}
/* 3つ揃った最初の1回だけ true（ボーナス付与はここで） */
function questBonus() {
  if (!S.quests.bonus && S.quests.done.review && S.quests.done.step && S.quests.done.spoken) { S.quests.bonus = true; S.coins += 10; return true; }
  return false;
}

/* ================= 答え合わせ ================= */
const CONTRACTIONS = [
  ["i'm", "i am"], ["you're", "you are"], ["he's", "he is"], ["she's", "she is"], ["it's", "it is"], ["we're", "we are"], ["they're", "they are"], ["that's", "that is"], ["there's", "there is"], ["what's", "what is"], ["where's", "where is"], ["who's", "who is"], ["how's", "how is"],
  ["isn't", "is not"], ["aren't", "are not"], ["wasn't", "was not"], ["weren't", "were not"], ["don't", "do not"], ["doesn't", "does not"], ["didn't", "did not"], ["can't", "cannot"], ["couldn't", "could not"], ["won't", "will not"], ["wouldn't", "would not"], ["shouldn't", "should not"], ["mustn't", "must not"], ["haven't", "have not"], ["hasn't", "has not"], ["hadn't", "had not"],
  ["i've", "i have"], ["you've", "you have"], ["we've", "we have"], ["they've", "they have"], ["i'll", "i will"], ["you'll", "you will"], ["he'll", "he will"], ["she'll", "she will"], ["we'll", "we will"], ["they'll", "they will"], ["it'll", "it will"], ["i'd", "i would"], ["you'd", "you would"], ["let's", "let us"],
];
function normalize(s) {
  let n = String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/[.,!?;:"()]/g, ' ').replace(/\s+/g, ' ').trim();
  for (const [a, b] of CONTRACTIONS) n = n.replace(new RegExp('\\b' + a.replace("'", "'") + '\\b', 'g'), b);
  return n.replace(/\s+/g, ' ').trim();
}
function stripLenient(n) { return n.replace(/\b(a|an|the)\b/g, ' ').replace(/(\w)s\b/g, '$1').replace(/\s+/g, ' ').trim(); }
function compare(input, answers, opts = {}) {
  const n = normalize(input);
  for (const a of answers) if (n === normalize(a)) return { ok: true };
  if (opts.lenient) for (const a of answers) if (stripLenient(n) === stripLenient(normalize(a))) return { ok: true, partial: true };
  return { ok: false, diff: wordDiff(n, normalize(answers[0])) };
}
/* 語単位の差分（正解側で「違う語」に印） */
function wordDiff(input, answer) {
  const a = input.split(' '), b = answer.split(' ');
  const m = a.length, n = b.length, L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const mark = new Array(n).fill(true); let i = 0, j = 0;
  while (i < m && j < n) { if (a[i] === b[j]) { mark[j] = false; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  return b.map((w, k) => ({ w, diff: mark[k] }));
}

function startSession() {
  const pending = loadSession();

  const { items, meta } = buildSession(S.settings.mode);
  if (!items.length) { toast('今日はもうやることがありません。ゆっくりどうぞ'); return; }
  sess = { items, meta, i: 0, stats: { correct: 0, answered: 0, xp: 0, spoken: 0, reviews: 0, reviewsDone: 0, combo: 0, comboBonus: false, cando: [], stars: {}, levelUp: 0, retry: [] }, startedAt: nowMs() };
  sess.stats.reviews = items.filter(x => x.phase === 'review').length;
  items.forEach(x => { if (x.cardId && S.cards[x.cardId]) sess.stats.stars[x.unit] = sess.stats.stars[x.unit] || unitStars(x.unit); });
  saveSession(sess); go('session');
}
function renderSession(app) {
  const total = sess.items.length + sess.stats.retry.length;
  const item = sess.items[sess.i];
  if (!item) { finishSession(); return; }
  app.innerHTML = `<div class="screen notab" style="gap:12px"><div class="shead"><button class="x" id="quit">×</button><div class="bar"><i style="width:${Math.round(sess.i / total * 100)}%"></i></div><div class="n">${sess.i + 1}/${total}</div></div><div id="qroot" class="q"></div></div>`;

    openModal(`<h3>中断しますか？</h3><p class="sub">続きは24時間保存されます</p><div class="btn-row"><button class="btn" id="m-no">もどる</button><button class="btn primary" id="m-yes">中断する</button></div>`);
    $('#m-no').addEventListener('click', closeModal);
    $('#m-yes').addEventListener('click', () => { closeModal(); stopSpeak(); saveSession(sess); sess = null; go('home'); });
  });
  if (item.kind === 'stepdone') { onStepDone(item); sess.i++; saveSession(sess); renderSession(app); return; }
  renderQuestion(item, $('#qroot', app), res => { onAnswer(item, res); sess.i++; saveSession(sess); render(); });
}
function onAnswer(item, res) {
  if (res.skip) return;
  const st = sess.stats; const stage = STAGE[item.kind]; const today = todayStr();
  st.answered++; dayLog('answered');
  if (res.correct) { st.correct++; dayLog('correct'); st.combo++; const n = XP[stage] || 2; st.xp += n; st.levelUp = addXp(n) || st.levelUp; }
  else st.combo = 0;
  if (st.combo === 5 && !st.comboBonus) { st.comboBonus = true; st.xp += XP.combo; st.levelUp = addXp(XP.combo) || st.levelUp; toast('5連続！ +10xp'); }
  if (item.kind === 'Q-08') {
    if (res.said) { st.spoken++; dayLog('spoken'); questUpdate('spoken'); S.said.push({ id: item.data.id, en: item.data.ans[0], ja: item.data.ja, at: today }); if (S.said.length > 500) S.said = S.said.slice(-500); }
    if (item.phase === 'lesson' && (res.q || 0) <= 1 && !item.retry) { sess.stats.retry.push(1); sess.items.push({ ...item, retry: true, phase: 'lesson' }); }
  }
  if (item.cardId && S.cards[item.cardId] && !item.retry) {
    const c = S.cards[item.cardId]; rate(c, res.q ?? (res.correct ? 2 : 0), res.rtMs, today);
    if (item.phase === 'review') { st.reviewsDone++; dayLog('reviews'); }
  }
  save();
}

  const st = sess.stats; const u = unitState(item.unit); const today = todayStr();
  if ((u.step || 1) <= item.step) u.step = item.step + 1;
  u.lastAt = today; st.xp += XP.step; st.levelUp = addXp(XP.step) || st.levelUp; questUpdate('step');
  if (item.step === 4 && !u.done) {

    st.cando.push(IDX.unit[item.unit].cando); S.lastCando = IDX.unit[item.unit].cando; dayLog('new');

}

  root.innerHTML = head(item, item.phase === 'lesson' ? '気づく' : '復習') + `<div class="prompt" style="font-size:1.125rem;font-weight:600;color:var(--ink2)">この文には、まちがっている単語が<b style="color:var(--accent)">1つ</b>あります</div>
    <div class="words">${words.map((w, i) => `<button class="w" data-i="${i}">${esc(w)}</button>`).join('')}</div>
    <div class="inst">その単語をタップ →</div>${whyBtn(item)}`;
  bindWhy(root, item); const t0 = nowMs();
  const strip = w => w.replace(/[.,!?]/g, '');
  $$('.w', root).forEach(b => b.addEventListener('click', () => {
    const w = strip(words[b.dataset.i]); const ok = w.toLowerCase() === d.err.toLowerCase();
    $$('.w', root).forEach(x => { x.disabled = true; if (strip(words[x.dataset.i]).toLowerCase() === d.err.toLowerCase()) x.classList.add('right'); else if (x === b) x.classList.add('pick'); });
    const fixedHtml = words.map(x => strip(x).toLowerCase() === d.err.toLowerCase() ? esc(x.replace(strip(x), d.fix)).replace(esc(d.fix), `<span style="color:var(--accent)">${esc(d.fix)}</span>`) : esc(x)).join(' ');
    const fixedCap = fixedHtml.charAt(0) === '<' ? fixedHtml : fixedHtml.charAt(0).toUpperCase() + fixedHtml.slice(1);
    feedback(root, ok, fixedCap, `${d.err} → ${d.fix}`, d.why, '', item);
    nextBtn(root, () => finish({ correct: ok, q: ok ? autoRate(true, nowMs() - t0) : 0 }));
  }));
}
/* ---- 4択（汎用） ---- */
function choiceQ(item, root, finish, promptHtml, choices, ans, fb) {
  root.innerHTML = promptHtml + `<div class="choices">${shuffle(choices).map(c => `<button class="btn" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>${whyBtn(item)}`;
  bindWhy(root, item); const t0 = nowMs();
  $$('[data-c]', root).forEach(b => b.addEventListener('click', () => {
    const ok = b.dataset.c === ans; $$('[data-c]', root).forEach(x => { x.disabled = true; if (x.dataset.c === ans) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
    feedback(root, ok, fb.en, fb.ja, fb.why, fb.alt, item);
    nextBtn(root, () => finish({ correct: ok, q: ok ? autoRate(true, nowMs() - t0) : 0 }));
  }));
}
function rQ03(item, root, finish) { const d = item.data; choiceQ(item, root, finish, head(item, '練習') + `<div class="prompt">${esc(d.q)}</div>`, d.choices, d.ans, { en: esc(d.ans), why: d.why }); }
function rQ04(item, root, finish) {
  const d = item.data; const filled = d.en.replace('___', d.ans);
  choiceQ(item, root, finish, head(item, '練習') + `<div class="prompt en">${esc(d.en).replace('___', '<span style="color:var(--accent)">___</span>')}</div>${d.ja ? `<div class="inst">${esc(d.ja)}</div>` : ''}`, d.choices, d.ans, { en: esc(filled).replace(esc(d.ans), `<span style="color:var(--accent)">${esc(d.ans)}</span>`), why: d.why });
}
function rVja(item, root, finish) {
  const v = item.data; const others = sample(VOCAB.filter(x => x.id !== v.id && x.pos === v.pos && x.ja !== v.ja), 3);
  while (others.length < 3) { const x = VOCAB[Math.floor(Math.random() * VOCAB.length)]; if (x.id !== v.id && !others.includes(x)) others.push(x); }
  choiceQ(item, root, finish, head(item, '単語') + `<div class="prompt en row" style="justify-content:center">${esc(v.en)} ${spkBtn(v.en)}</div><div class="inst">意味は？</div>`, [v.ja, ...others.map(o => o.ja)], v.ja, { en: esc(v.en), ja: v.ja, alt: v.ex ? v.ex.en : '' });
  speak(v.en, 'en');
}
function rQ12(item, root, finish) {
  const v = item.data; const others = sample(VOCAB.filter(x => x.id !== v.id && x.pos === v.pos), 3);
  while (others.length < 3) { const x = VOCAB[Math.floor(Math.random() * VOCAB.length)]; if (x.id !== v.id && !others.includes(x)) others.push(x); }
  choiceQ(item, root, finish, head(item, '単語') + `<div class="prompt row" style="justify-content:center">🎧 ${spkBtn(v.en, 'en', 'on')}</div><div class="inst">聞こえた単語は？（もう一度聞ける）</div>`, [v.en, ...others.map(o => o.en)], v.en, { en: esc(v.en), ja: v.ja });

}
/* ---- 受け答え 4択 ---- */
function rQ10a(item, root, finish) {
  const d = item.data;
  const promptHtml = head(item, '受け答え') + `<div class="card"><div class="eyebrow">相手</div><div class="row"><div class="grow" style="font-size:1.25rem;font-weight:800">${esc(d.q)}</div>${spkBtn(d.q, 'en', 'on')}</div><div class="sub" id="qja" style="opacity:0;transition:opacity .4s">${esc(d.qja)}</div></div><div class="inst">あなたの返しは？</div>`;
  choiceQ(item, root, finish, promptHtml, [d.a, ...d.wrong], d.a, { en: esc(d.a), ja: d.aja });
  speak(d.q, 'en'); setTimeout(() => { const e = $('#qja', root); if (e) e.style.opacity = 1; }, 3000);
}
/* ---- 並べ替え / 書き換え / 受け答え組み立て ---- */
function rChips(item, root, finish) {
  const d = item.data; let tokens, dummy, ans, promptHtml, title, ja;
  if (item.kind === 'Q-05') { tokens = d.tokens; dummy = d.dummy || []; ans = d.ans; ja = d.ja; title = '練習'; promptHtml = `<div class="prompt">${esc(d.ja)}</div><div class="inst">単語をタップして英語にする</div>`; }
  else if (item.kind === 'Q-07') {
    tokens = d.ans[0].split(' '); ans = d.ans; title = '練習';
    const lower = new Set(tokens.map(t => normalize(t))); dummy = d.en.split(' ').filter(w => !lower.has(normalize(w))).slice(0, 2);
    promptHtml = `<div class="prompt en">${esc(d.en)}</div><div class="inst">→ ${esc(d.inst)}</div>`;
  } else { // Q-10b
    tokens = d.a.split(' '); ans = [d.a]; ja = d.aja; title = '受け答え';
    const lower = new Set(tokens.map(t => normalize(t))); dummy = shuffle(d.wrong.join(' ').split(' ').filter(w => !lower.has(normalize(w)))).slice(0, 2);
    promptHtml = `<div class="card"><div class="eyebrow">相手</div><div class="row"><div class="grow" style="font-size:1.125rem;font-weight:800">${esc(d.q)}</div>${spkBtn(d.q, 'en', 'on')}</div><div class="sub">${esc(d.qja)}</div></div><div class="inst">返しを組み立てる：${esc(d.aja)}</div>`;
  }
  const pool = shuffle([...tokens, ...dummy].map((w, i) => ({ w, i })));
  const placed = [];
  root.innerHTML = head(item, title) + promptHtml + `<div class="answer-row" id="ans"></div><div class="chips" id="pool"></div>${whyBtn(item)}<div class="qfoot"><button class="btn primary" id="check" disabled>こたえる</button></div>`;
  bindWhy(root, item); const t0 = nowMs();
  if (item.kind === 'Q-10b') speak(d.q, 'en');
  const draw = () => {
    $('#ans', root).innerHTML = placed.map(p => `<button class="chip" data-p="${p.i}">${esc(p.w)}</button>`).join('');
    $('#pool', root).innerHTML = pool.map(p => `<button class="chip ${placed.includes(p) ? 'ghost' : ''}" data-q="${p.i}" ${placed.includes(p) ? 'disabled' : ''}>${esc(p.w)}</button>`).join('');
    $('#check', root).disabled = placed.length < tokens.length;
    $$('[data-q]', root).forEach(b => b.addEventListener('click', () => { placed.push(pool.find(p => p.i == b.dataset.q)); draw(); }));
    $$('[data-p]', root).forEach(b => b.addEventListener('click', () => { const k = placed.findIndex(p => p.i == b.dataset.p); placed.splice(k, 1); draw(); }));
  };
  draw();
  $('#check', root).addEventListener('click', () => {
    const got = placed.map(p => p.w).join(' '); const r = compare(got, ans); const ok = r.ok;
    $('#check', root).remove(); $$('#pool button', root).forEach(b => b.disabled = true);
    const enHtml = ok ? esc(ans[0]) : r.diff.map(x => x.diff ? `<u>${esc(x.w)}</u>` : esc(x.w)).join(' ');
    feedback(root, ok, ok ? esc(ans[0]) : esc(ans[0]), ja, d.why || '', ans.length > 1 ? ans.slice(1).join(' / ') : '', item);
    if (!ok) { const b = $('.fb', root); const p = document.createElement('div'); p.className = 'alt'; p.innerHTML = 'あなたの答え：' + esc(got); b.appendChild(p); }
    nextBtn(root, () => finish({ correct: ok, q: ok ? autoRate(true, nowMs() - t0) : 0 }));
  });
}
/* ---- 瞬間英作文（自己判定） ---- */
function rQ08(item, root, finish) {
  const g = item.data; const silent = S.settings.silent; let revealed = false, timer = null, saidAt = null;
  const title = item.phase === 'sprint' ? 'スプリント' : item.phase === 'review' ? '復習' : '使う';
  root.innerHTML = head(item, title) + `<div class="inst">${silent ? '心の中で英語にする' : '声に出して英語にする'}</div><div class="prompt">${esc(g.ja)}</div>
    <div class="ring"><svg viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="37"/><circle class="fg" cx="42" cy="42" r="37" stroke-dasharray="232.5" stroke-dashoffset="0"/></svg><div class="n" id="tn">5</div></div>
    <div id="fbslot"></div>
    <div class="qfoot"><div class="btn-row"><button class="btn" id="no">言えなかった</button><button class="btn ok" id="yes">言えた</button></div><button class="tinybtn" id="reveal">答えを見る</button></div>`;
  const t0 = nowMs(); let left = 5;
  const fg = $('.fg', root);
  const reveal = () => {
    if (revealed) return; revealed = true; clearInterval(timer);
    $('.ring', root).style.display = 'none'; const rb = $('#reveal', root); if (rb) rb.remove();
    const slot = $('#fbslot', root); slot.innerHTML = `<div class="fb ok" style="background:var(--card2);color:var(--ink)"><div class="en"><span>${esc(g.ans[0])}</span>${spkBtn(g.ans[0])}</div>${g.ans.length > 1 ? `<div class="alt">ほかの言い方：${esc(g.ans.slice(1).join(' / '))}</div>` : ''}</div>`;
    bindSpk(slot); speak(g.ans[0], 'en');
  };
  timer = setInterval(() => { left--; $('#tn', root).textContent = Math.max(0, left); fg.style.strokeDashoffset = 232.5 * (1 - left / 5); if (left <= 0) reveal(); }, 1000);
  $('#reveal', root).addEventListener('click', reveal);
  const judge = said => {
    const rt = (saidAt || nowMs()) - t0; const wasRevealed = revealed;
    if (!revealed) reveal();
    $('#yes', root).disabled = $('#no', root).disabled = true;
    const q = selfRate(said, rt, wasRevealed);
    const b = $('.fb', root); if (b) { b.classList.remove('ok'); b.classList.add(said ? 'ok' : 'ng'); b.style.background = ''; b.style.color = ''; }
    sfx(said ? 'ok' : 'ng');
    nextBtn(root, () => finish({ correct: said, q, said, revealed: wasRevealed }));
  };
  $('#yes', root).addEventListener('click', () => { saidAt = nowMs(); judge(true); });
  $('#no', root).addEventListener('click', () => judge(false));
}
/* ---- 意味→英（入力） ---- */
function rQ11(item, root, finish) {
  const v = item.data;
  root.innerHTML = head(item, '単語') + `<div class="prompt">${esc(v.ja)}</div><div class="inst">英語で（${esc(v.pos)}）</div>
    <input class="textin" id="in" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" lang="en" placeholder="English">
    <div class="qfoot"><div class="btn-row"><button class="btn" id="dunno">分からない</button><button class="btn primary" id="check">こたえる</button></div></div>`;
  const t0 = nowMs(); const inp = $('#in', root); setTimeout(() => inp.focus(), 50);
  const finishWith = ok => {
    inp.disabled = true; $('#check', root).disabled = true; $('#dunno', root).disabled = true;
    feedback(root, ok, esc(v.en), v.ja, '', v.ex ? v.ex.en : '', item);
    nextBtn(root, () => finish({ correct: ok, q: ok ? autoRate(true, nowMs() - t0) : 0 }));
  };
  const check = () => { const r = compare(inp.value, [v.en]); finishWith(r.ok); };
  $('#check', root).addEventListener('click', check);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); check(); } });
  $('#dunno', root).addEventListener('click', () => finishWith(false));
}

(function init() {
  load();
  buildIndex();
  applyTheme();
  syncContent(); save();
  if (S.profile.onboarded) dailyTick();
  document.body.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
  document.body.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { if (sess) saveSession(sess); stopSpeak(); }
    else if (S.profile.onboarded && dailyTick()) render();
  });
  window.addEventListener('pageshow', () => { if (S.profile.onboarded && dailyTick()) render(); });
  route = 'home';
  render();

  // Service Worker
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('新しいバージョンがあります。アプリを開き直すと反映されます', 4000); });
      });
    }).catch(() => { });
  }
  // Safari で開いていて、まだホーム画面に追加していないとき
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!standalone && /iPhone|iPad/.test(navigator.userAgent) && !localStorage.getItem('gp.a2hs')) {
    setTimeout(() => { toast('共有 → 「ホーム画面に追加」でアプリとして使えます', 5000); try { localStorage.setItem('gp.a2hs', '1'); } catch (e) { } }, 1500);
  }
})();
